#
# THE WALLET ON EVERY DESKTOP (lane speed5, 2026-11-18): macOS, Windows and Linux installers built from this repository's
# source on each system's own runner, the node bundled inside each one as the wallet's sidecar, and a smoke test on that
# same system before anything is uploaded. Runs on a published testnet build (a push to main is only ever the testnet
# channel's gated source, scratchpad/testnet_channel.py publish) and by hand.
#
# What each job proves, said plainly: the node and the wallet COMPILE on that system, the installer is PRODUCED, and the
# bundled node STARTS there (`usdmd-node --version`). It does not click through the wallet's screens: a person on that
# system still opens the installed app once before a release is called working there.
name: wallet-builds

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS is built and tested on the release machine (a DMG with its Applications drop target, ad-hoc signed): this account's
        # GitHub runners refuse macOS ("The configuration 'macos-14-arm64-us-default' is not supported", run 44249810052).
        include:
          - os: windows-latest
            bundles: msi,nsis
            node_bin: usdmd-node.exe
          - os: ubuntu-22.04
            bundles: deb,appimage
            node_bin: usdmd-node
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies (the webview and tray libraries Tauri links)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf build-essential pkg-config libssl-dev liblzma-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the node (release)
        working-directory: monerousd-node-zkdag
        run: cargo build --release --bin usdmd-node

      - name: Smoke — the node starts on this system
        shell: bash
        run: ./monerousd-node-zkdag/target/release/${{ matrix.node_bin }} --version

      - name: Bundle the node into the wallet as its sidecar
        shell: bash
        run: |
          mkdir -p monerousd-wallet-v2/src-tauri/sidecar
          rm -f monerousd-wallet-v2/src-tauri/sidecar/usdmd-node monerousd-wallet-v2/src-tauri/sidecar/usdmd-node.exe
          cp monerousd-node-zkdag/target/release/${{ matrix.node_bin }} monerousd-wallet-v2/src-tauri/sidecar/
          # The launchpad apps ship with the wallet (its app host serves them from the installer's resource folder): every
          # site bundle except the promo films, editor backups and Markdown.
          rm -rf monerousd-wallet-v2/src-tauri/sites
          cp -R monerousd-node-zkdag/sites monerousd-wallet-v2/src-tauri/sites
          find monerousd-wallet-v2/src-tauri/sites \( -name '*.mp4' -o -name '*.pre*' -o -name '*.md' -o -name '.canonical-restore-*' \) -prune -exec rm -rf {} +
          du -sh monerousd-wallet-v2/src-tauri/sites

      - name: Build the wallet installer
        working-directory: monerousd-wallet-v2
        shell: bash
        run: |
          npm ci
          # Every installer needs its icon set (Windows: icon.ico for the program's resource file; AppImage: a square PNG;
          # run 44266xxxx failed on both). Generated from the one square 512 px source by Tauri's own command.
          npx tauri icon src-tauri/icons/icon.png
          # Only the wallet program goes into an installer: the test harnesses (wallet-harness drives the macOS Bluetooth
          # tap) are not built here (run 44256233250: wallet-harness did not compile on Linux, where that radio is absent).
          npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"active":true,"resources":["sidecar/*","sites/**/*"],"icon":["icons/32x32.png","icons/128x128.png","icons/128x128@2x.png","icons/icon.icns","icons/icon.ico"]}}' -- --bin monerousd-wallet-v2

      - name: Smoke — the installer exists and the bundled node inside it starts
        shell: bash
        run: |
          B=monerousd-wallet-v2/src-tauri/target/release/bundle
          ls "$B"/*   # the bundle folders (an `ls -R | head` broke its pipe under bash -o pipefail and failed the job)
          case "${{ runner.os }}" in
            macOS)
              DMG=$(ls "$B"/dmg/*.dmg | head -1)
              hdiutil attach "$DMG" -mountpoint /tmp/musd -nobrowse
              ls /tmp/musd   # the app and the Applications drop target
              test -L /tmp/musd/Applications
              APP=$(ls -d /tmp/musd/*.app | head -1)
              "$APP"/Contents/Resources/sidecar/usdmd-node --version
              hdiutil detach /tmp/musd ;;
            Windows)
              ls "$B"/msi/*.msi "$B"/nsis/*.exe ;;
            Linux)
              ls "$B"/deb/*.deb "$B"/appimage/*.AppImage
              dpkg-deb -c "$B"/deb/*.deb | grep -q sidecar/usdmd-node
              dpkg-deb -c "$B"/deb/*.deb | grep -q sites/ionswap-monerousd-org/index.html ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: monerousd-wallet-${{ runner.os }}
          path: |
            monerousd-wallet-v2/src-tauri/target/release/bundle/dmg/*.dmg
            monerousd-wallet-v2/src-tauri/target/release/bundle/msi/*.msi
            monerousd-wallet-v2/src-tauri/target/release/bundle/nsis/*.exe
            monerousd-wallet-v2/src-tauri/target/release/bundle/deb/*.deb
            monerousd-wallet-v2/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
