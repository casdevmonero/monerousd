#
# Two-machine MoneroPay BLE conformance probe. A tiny standalone binary that shares the EXACT
# moneropay.rs (protocol) + moneropay_ble.rs (Core Bluetooth radio) the desktop wallet uses. Run
# `moneropay-ble-probe merchant "<text>"` on one Mac and `moneropay-ble-probe payer` on another —
# the charge crosses the REAL Bluetooth air between two separate radios. This is the device-to-device
# proof that generalizes to all users (same code every platform compiles for its target).
[package]
name = "moneropay-ble-probe"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

# Standalone: its own workspace root so it never gets pulled into the wallet's build graph.
[workspace]

[[bin]]
name = "moneropay-ble-probe"
path = "src/main.rs"

[dependencies]
rand = "0.8"           # CSPRNG for the rotating per-charge beacon id (moneropay::fresh_beacon_id)
fips203 = "0.4"        # ML-KEM-768 session (charge encrypted over the air)
blake3 = "1"           # AEAD keystream + MAC + framing integrity
serde_json = "1"       # status/report shaping (reused from moneropay_ble.rs)
# The shared moneropay_ble.rs now bridges the node's BLE cell transport (usdmd_node::ble_frame / serve::ble_bridge),
# so the standalone probe links the SAME node lib the wallet does — identical radio path, no drift.
usdmd-node = { path = "../../monerousd-node-zkdag", default-features = false, features = ["arti-onion"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
dispatch2 = "0.3"      # the serial GCD queue that owns the Core Bluetooth delegate callbacks
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSString", "NSError", "NSData", "NSArray", "NSDictionary", "NSValue", "NSUUID", "NSObject", "NSEnumerator",
] }
objc2-core-bluetooth = { version = "0.3", features = [
    "std", "alloc", "bitflags",
    "CBCentralManager", "CBPeripheralManager", "CBManager", "CBPeripheral", "CBCentral",
    "CBCentralManagerConstants", "CBService", "CBCharacteristic", "CBUUID", "CBPeer", "CBAttribute",
    "CBATTRequest", "CBError", "CBAdvertisementData", "CBPeripheralManagerConstants", "CBDescriptor",
    "CBDefines",
] }

[profile.release]
opt-level = 2
