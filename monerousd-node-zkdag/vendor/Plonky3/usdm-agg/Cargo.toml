[package]
name = "usdm-agg"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "MonerousD's recursive proof tree: the verifier row that checks committed-door proofs (payment carriers and its own) in circuit, so a block's aggregate stays constant while the payments it carries grow with the producers (docs/LEVEL-AGGREGATE-SPEC-20261115.md §12)."
publish = false

[lib]
name = "usdm_agg"

[dependencies]
usdm-decider = { path = "../usdm-decider" }
p3-field = { workspace = true }
p3-koala-bear = { workspace = true }
p3-poseidon2 = { workspace = true }
p3-poseidon2-air = { workspace = true }
p3-symmetric = { workspace = true }
p3-challenger = { workspace = true } # piece C: the program's transcript is pinned against the real challenger
rand = { workspace = true }

p3-sumcheck = { workspace = true } # piece C: WhirVerifier::verify as a program reads the WHIR proof and configuration types
p3-whir = { workspace = true } # piece C: WhirVerifier::verify as a program reads the WHIR proof and configuration types
serde = { workspace = true, features = ["derive", "alloc"] } # the SSA row: GKR proofs and tree node proofs on the wire
postcard = { version = "1.1.3", features = ["use-std"] } # the SSA row: the decider's one wire encoding
p3-commit = { workspace = true } # the SSA door: the commitment type; the query pins
p3-multilinear-util = { workspace = true } # the SSA door: points and polynomials; the query pins

[dev-dependencies]
p3-matrix = { workspace = true } # piece C: the query is pinned against a real commitment and Poly::eval_ext
p3-dft = { workspace = true } # piece C: the whole-verifier pin proves a real WHIR opening
usdm-decider = { path = "../usdm-decider", features = ["test-support"] } # V2 (b): the ledger door pin proves real spend carriers (NoteOwner::from_test_key)
