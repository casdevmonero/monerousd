[package]
name = "p3-sumcheck"
description = "Sumcheck protocol engine (product polynomials, SVO, HVZK masks)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
parallel = ["p3-maybe-rayon/parallel"]
test-util = ["dep:p3-baby-bear"]

[dependencies]
p3-baby-bear = { workspace = true, optional = true }
p3-challenger.workspace = true
p3-commit.workspace = true
p3-dft.workspace = true
p3-field.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
# ⭐ link 79 (2026-10-21): DIRECT rayon at two named sites of the streamed commit (`commit.rs::direct_par`: the coset fold
# and the lazy row evaluation), each a pure per-row function — byte-identical on any pool, pinned by the decider's
# `a_parallel_prove_is_byte_identical_to_a_one_thread_prove`. The shim's graph-wide `parallel` feature stays OFF.
rayon.workspace = true
# SPEED R4 (2026-11-10): the lock over the rows an opening derived ahead of itself (`commit.rs::CodewordRows::prime_rows`);
# the crate is no_std, and `p3-merkle-tree` already carries this lock for its salt rng.
spin.workspace = true
p3-multilinear-util.workspace = true
p3-util.workspace = true
p3-zk-codes.workspace = true

itertools.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive", "alloc"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
p3-baby-bear = { path = "../baby-bear" }
p3-koala-bear = { path = "../koala-bear" }
p3-merkle-tree = { path = "../merkle-tree" }
p3-symmetric = { path = "../symmetric" }

proptest.workspace = true

[lints]
workspace = true
