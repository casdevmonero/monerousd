[workspace]
resolver = "2"
members = [
    # pqpool + pqpool_ffi (the retired STARK-era prover monolith + its C-ABI) DELETED as vestigial 2026-07-15
    # (user-authorized): the greenfield node builds 100% WHIR via usdm-decider (which explicitly compiles WITHOUT
    # the pqpool circuit.rs monolith), and the live legacy C++ daemon links its OWN separate copy under
    # MoneroUSD-clean/monero/external/Plonky3 — never this vendored one. See [[feedback_stark_retired_whir]].
    "usdm-decider",
    # lane agg 2026-11-15: the recursive proof tree (docs/LEVEL-AGGREGATE-SPEC-20261115.md §12)
    "usdm-agg",
    "air",
    "baby-bear",
    "batch-stark",
    "blake3",
    "blake3-air",
    "bn254",
    "challenger",
    "circle",
    "commit",
    "dft",
    "examples",
    "field",
    "field-testing",
    "fri",
    "goldilocks",
    "keccak",
    "keccak-air",
    "koala-bear",
    "lookup",
    "matrix",
    "maybe-rayon",
    "mds",
    "merkle-tree",
    "mersenne-31",
    "monolith",
    "monolith-air",
    "monty-31",
    "multilinear-util",
    "poseidon1",
    "poseidon1-air",
    "poseidon2",
    "poseidon2-air",
    "rescue",
    "sha256",
    "sumcheck",
    "symmetric",
    "uni-stark",
    "util",
    "whir",
    "zk-codes",
]

[workspace.lints]
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.unused_must_use = "deny"
rust.rust_2024_incompatible_pat = "warn"
rustdoc.all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Some pedantic lints
semicolon_if_nothing_returned = "warn"
match_bool = "warn"
needless_pass_by_value = "warn"

redundant_pub_crate = "allow"
too_long_first_doc_paragraph = "allow"
unused_peekable = "allow"
tuple_array_conversions = "allow"
transmute_undefined_repr = "allow"
cognitive_complexity = "allow"

[workspace.dependencies]
blake3 = { version = "1.8", default-features = false }
clap = { version = "4.5.60", features = ["derive"] }
criterion = "0.8"
hashbrown = "0.17.0"
hex-literal = "1.1.0"
itertools = { version = "0.14.0", default-features = false, features = [
    "use_alloc",
] }
libm = "0.2"
num-bigint = { version = "0.4.6", default-features = false }
paste = "1.0.15"
postcard = { version = "1.1.3", default-features = false }
proptest = { version = "1.10", default-features = false, features = ["std"] }
rand = { version = "0.10.0", default-features = false }
rand_xoshiro = "0.8.0"
rayon = "1.11.0"
serde = { version = "1.0", default-features = false }
serde_json = "1.0.149"
sha2 = { version = "0.11.0", default-features = false }
shake = { version = "0.1.0", default-features = false }
spin = "0.11.0"
thiserror = { version = "2.0", default-features = false }
tiny-keccak = "2.0.2"
tracing = { version = "0.1.44", default-features = false, features = [
    "attributes",
] }
tracing-forest = "0.3.1"
tracing-subscriber = { version = "0.3.22", default-features = false, features = [
    "alloc",
] }
transpose = "0.2.3"

# Local dependencies
p3-air = { path = "air", version = "0.5.1" }
p3-baby-bear = { path = "baby-bear", version = "0.5.1" }
p3-blake3 = { path = "blake3", version = "0.5.1" }
p3-blake3-air = { path = "blake3-air", version = "0.5.1" }
p3-bn254 = { path = "bn254", version = "0.5.1" }
p3-challenger = { path = "challenger", version = "0.5.1" }
p3-circle = { path = "circle", version = "0.5.1" }
p3-commit = { path = "commit", version = "0.5.1" }
p3-dft = { path = "dft", version = "0.5.1" }
p3-examples = { path = "examples", version = "0.3.0" }
p3-field = { path = "field", version = "0.5.1" }
p3-field-testing = { path = "field-testing", version = "0.5.1" }
p3-fri = { path = "fri", version = "0.5.1" }
p3-goldilocks = { path = "goldilocks", version = "0.5.1" }
p3-keccak = { path = "keccak", version = "0.5.1" }
p3-keccak-air = { path = "keccak-air", version = "0.5.1" }
p3-koala-bear = { path = "koala-bear", version = "0.5.1" }
p3-lookup = { path = "lookup", version = "0.5.1" }
p3-matrix = { path = "matrix", version = "0.5.1" }
# ⛔⛔⛔ `parallel` STAYS OFF HERE, AND THAT IS A MEASURED DECISION, NOT AN OVERSIGHT — MEASURED TWICE.
# 2026-09-15 (§CA): turning it on switched rayon into fri/uni-stark/merkle-tree/multilinear-util and made
# proving NONDETERMINISTIC — two identical proves, same LENGTH, different BYTES (`[delta] determinism:
# 409739 B vs 409739 B, equal=false`; `equal=true` at RAYON_NUM_THREADS=1): a consensus break.
# 2026-09-28 17:18 (§M6-T, docs/O1-OPENINGS-RECURSION-SPEC.md): tried again after the proof-of-work grind
# had been made deterministic (challenger/src/grinding_challenger.rs, chunked `min_by_key`) — the committed
# prover returned None on its first grinding instance and the decider suite went red across modules: the
# vendored parallel code paths are not the serial paths this tree was built and pinned against. Reverted
# within the minute. The decider gets its parallelism from a DIRECT rayon dependency at named sites
# (usdm-decider/Cargo.toml), each with a byte-identity pin; Plonky3's own crates stay serial.
# RE-MEASURED 2026-09-29 02:28–02:32 with `features = ["parallel"]` in a separate target dir (the two 9/28 reverts
# rested on a wrong attribution: the anchor-fold reds were DB-159's stale transcript mirror, since deleted at source):
# byte-identity pin GREEN (10 workers == 1 thread), M6-D shape pin GREEN (digest identical, 1.3 s vs 4.2 s), genesis
# step 260.3 s — commit_w 3.6 s (serial 15–21), commit_f 1.0 s (4–5), recommit 3.1 s (15–22), but open_w 180.7 s and
# open_f 62.9 s unchanged (the grinds and query openings, already parallel through try_grind): ≈ 30–45 s of a ~260 s step.
# KEPT OFF: a graph-wide behaviour change whose blast set is the whole suite, which this machine cannot run tonight,
# for ~12 %. Flip it back on when the final sweep runs and re-measure there.
p3-maybe-rayon = { path = "maybe-rayon", version = "0.5.1" }
p3-mds = { path = "mds", version = "0.5.1" }
p3-merkle-tree = { path = "merkle-tree", version = "0.5.1" }
p3-mersenne-31 = { path = "mersenne-31", version = "0.5.1" }
p3-monolith = { path = "monolith", version = "0.5.1" }
p3-monolith-air = { path = "monolith-air", version = "0.5.1" }
p3-monty-31 = { path = "monty-31", version = "0.5.1" }
p3-multilinear-util = { path = "multilinear-util", version = "0.5.1" }
p3-poseidon1 = { path = "poseidon1", version = "0.5.1" }
p3-poseidon1-air = { path = "poseidon1-air", version = "0.5.1" }
p3-poseidon2 = { path = "poseidon2", version = "0.5.1" }
p3-poseidon2-air = { path = "poseidon2-air", version = "0.5.1" }
p3-rescue = { path = "rescue", version = "0.5.1" }
p3-sha256 = { path = "sha256", version = "0.5.1" }
p3-sumcheck = { path = "sumcheck", version = "0.5.1" }
p3-symmetric = { path = "symmetric", version = "0.5.1" }
p3-uni-stark = { path = "uni-stark", version = "0.5.1" }
p3-util = { path = "util", version = "0.5.1" }
p3-whir = { path = "whir", version = "0.5.1" }
p3-zk-codes = { path = "zk-codes", version = "0.5.1" }

[workspace.package]
# General description field used for the sub-crates that are currently missing a description.
description = "Plonky3 is a toolkit for implementing polynomial IOPs (PIOPs), such as PLONK and STARKs."
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Plonky3/Plonky3"
homepage = "https://github.com/Plonky3/Plonky3"
keywords = ["cryptography", "SNARK", "PLONK", "FRI", "plonky3"]
categories = ["cryptography::cryptocurrencies"]

[profile.profiling]
inherits = "release"
debug = true

[profile.release]
incremental = true

# ⭐ `pin` (user 2026-10-05 fast + accurate is the standard, feedback_pin_profile_fast_accurate_tests_20261005): the test
# build every decider pin batch uses — release semantics (debug-assertions off, overflow-checks off, opt-3 everywhere:
# proving speed IS the measurement here, so no package is lowered), incremental with 256 codegen units so a one-line edit
# rebuilds the edited crate only. `release` stays the production build. lane_run.sh maps `release`/`strict` here.
[profile.pin]
inherits = "release"
incremental = true
codegen-units = 256
