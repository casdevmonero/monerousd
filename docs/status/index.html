<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonerousD status</title>
<!--
  readiness T6 item 4 — THE PUBLIC STATUS PAGE (docs/PUBLIC-TESTNET-LAUNCH.md §2): one static file, no backend, no build step.
  It reads ONLY `/get_info` fields that are chain-wide health constants or counters every node already publishes to every
  peer — height, blue score, finalized height, DAG width, target spacing, peer count, mesh joined, the public tps and
  proving-power figures (pure functions of the chain parameters), the network id and the build time. It reads NO count of
  notes, records, transactions, wants or stalls (a real count is metadata — DIGITAL CASH), no addresses, no node-local
  timing. The node list is the viewer's: a wallet user points it at their own node (loopback); a visitor at any public RPC
  they trust. Nothing here is a server on the critical path.
  DIGITAL-CASH-PRIVACY-REVIEWED: every field shown is named in the allow-list below; a field not in it is never rendered.
-->
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --mute: #666; --ok: #1b7f3b; --bad: #a12b2b; --card: #fff; --line: #e3e3e3; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #121212; --mute: #9a9a9a; --card: #1c1c1c; --line: #2a2a2a; } }
  body { margin: 0; padding: 24px 16px; font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--mute); margin-bottom: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input { flex: 1; min-width: 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
  button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .k { color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .v { font-size: 20px; font-weight: 600; margin-top: 4px; word-break: break-all; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .foot { color: var(--mute); font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>MonerousD status</h1>
  <div class="sub">What every node publishes about the chain. Nothing about any user, note or amount is here, or anywhere.</div>
  <div class="row">
    <input id="rpc" value="http://127.0.0.1:27780" aria-label="node RPC URL" spellcheck="false">
    <button id="go">Read</button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="foot" class="foot">Not read yet.</div>
</main>
<script>
(function () {
  // THE ALLOW-LIST: the only /get_info fields this page renders (chain-wide health, constant shape, no counts of items).
  var SHOW = [
    ["mesh_joined", "mesh joined", function (v) { return v === true ? "yes" : "no"; }],
    ["network_id", "network", String],
    ["height", "height", String],
    ["blue_score", "blue score", String],
    ["finalized_height", "finalized height", String],
    ["dag_width", "DAG width", String],
    ["target_spacing_ms", "block target (ms)", String],
    ["peers", "peers", String],
    ["tps", "settled tx/s (parameter)", String],
    ["proving_power", "proving power (proof-hashes/s)", String],
    ["build_time", "node build", String]
  ];
  var grid = document.getElementById("grid"), foot = document.getElementById("foot"), rpc = document.getElementById("rpc");
  function card(label, value, cls) {
    var c = document.createElement("div"); c.className = "card";
    var k = document.createElement("div"); k.className = "k"; k.textContent = label;
    var v = document.createElement("div"); v.className = "v" + (cls ? " " + cls : ""); v.textContent = value;
    c.appendChild(k); c.appendChild(v); return c;
  }
  function render(info) {
    grid.textContent = "";
    SHOW.forEach(function (f) {
      var key = f[0], label = f[1], fmt = f[2];
      if (!(key in info)) { return; } // a field a node does not publish is simply not shown
      var cls = key === "mesh_joined" ? (info[key] === true ? "ok" : "bad") : "";
      grid.appendChild(card(label, fmt(info[key]), cls));
    });
  }
  function read() {
    var base = rpc.value.replace(/\/+$/, "");
    foot.textContent = "Reading " + base + "/get_info …";
    fetch(base + "/get_info", { cache: "no-store" })
      .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function (info) {
        render(info);
        foot.textContent = "Read at " + new Date().toISOString().replace("T", " ").slice(0, 19) + " UTC" +
          (info.busy === true ? " — the node answered from its cache while busy" : "") + ". Re-reads every 5 s.";
      })
      .catch(function (e) {
        grid.textContent = "";
        grid.appendChild(card("node", "unreachable", "bad"));
        foot.textContent = "Could not read " + base + "/get_info (" + e.message + "). A wallet's node answers on loopback only; a public node names its RPC.";
      });
  }
  document.getElementById("go").addEventListener("click", read);
  rpc.addEventListener("keydown", function (e) { if (e.key === "Enter") { read(); } });
  read();
  setInterval(read, 5000);
})();
</script>
</body>
</html>
